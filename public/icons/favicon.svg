<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 브라우저 탭 파비콘. 라이트: 흰 바탕 검정 로고 / 다크: 검정 바탕 흰 로고 (prefers-color-scheme).
       사파리는 SVG 파비콘을 읽지 않으므로 app/favicon.ico(라이트)를 쓴다. -->
  <style>
    .bg { fill: #ffffff; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #212121; }
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <image class="light" x="5" y="5" width="54" height="54" href="data:image/png;base64,"/>
  <image class="dark" x="5" y="5" width="54" height="54" href="data:image/png;base64,"/>
</svg>
