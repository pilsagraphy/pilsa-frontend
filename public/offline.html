<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연결 없음 · 필사그래피</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #fff;
        color: #212121;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; margin-bottom: 8px; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.36px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; letter-spacing: -0.28px; color: #757575; word-break: keep-all; }
      button {
        margin-top: 16px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 8px;
        background: #212121;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>네트워크 상태를 확인한 뒤<br />다시 시도해주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </body>
</html>
