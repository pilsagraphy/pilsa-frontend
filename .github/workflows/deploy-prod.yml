name: Deploy Production

# release-app 브랜치 push 시 운영 프론트(포트 3000, pm2 pilsa-frontend)에 자동 배포
on:
  push:
    branches: [release-app]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: release-app

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Deploy frontend to Production
        run: |
          set -euo pipefail

          echo "===== [1/4] 소스 최신화 (origin/${DEPLOY_BRANCH}) ====="
          cd ~/frontend
          git fetch origin "${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"
          git log --oneline -1

          echo "===== [2/4] 의존성 설치 & Next.js 빌드 ====="
          npm install
          npm run build

          echo "===== [3/4] pm2 재시작 (pilsa-frontend) ====="
          pm2 restart pilsa-frontend

          echo "===== [4/4] 헬스체크 (포트 3000) ====="
          for i in $(seq 1 15); do
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ]; then
              echo "운영 프론트 응답 확인 (HTTP $code, 약 $((i*2))초 소요)"
              exit 0
            fi
          done
          echo "운영 프론트가 응답하지 않습니다. 최근 로그:"
          pm2 logs pilsa-frontend --lines 50 --nostream
          exit 1
